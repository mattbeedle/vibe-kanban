# Fly.io configuration for Vibe Kanban Relay Server
# WebRTC/WebSocket relay for workspace tunneling
# Deploy with: fly deploy --config fly.toml

app = 'vibe-kanban-relay'
primary_region = 'sjc'  # Change to your preferred region

[build]
  dockerfile = "Dockerfile"
  # Build context is repo root
  build_arg = { DOCKER_BUILDKIT = "1" }

[env]
  # Logging
  RUST_LOG = "info"

  # Server config
  RELAY_LISTEN_ADDR = "0.0.0.0:8082"

# HTTP service configuration
[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

# Health checks
[[services]]
  protocol = "tcp"
  internal_port = 8082

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

  # TCP health check
  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"

  # HTTP health check
  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/health"
    protocol = "http"

# VM resources (relay is lightweight)
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets to configure via `fly secrets set -a vibe-kanban-relay`:
#
# Required:
#   SERVER_DATABASE_URL              - PlanetScale Postgres connection string (same as main app)
#   VIBEKANBAN_REMOTE_JWT_SECRET     - JWT signing secret (MUST match main app)
#
# Note: The JWT secret must be identical to the main app for authentication to work
